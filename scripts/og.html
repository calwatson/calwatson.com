<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <style>
      html,
      body {
        margin: 0;
        width: 1200px;
        height: 630px;
        background: #07120e;
        color: #e8f3ec;
        font-family: Georgia, serif;
      }
      .card {
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
      }
      .name {
        font-size: 92px;
        font-weight: 800;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .tag {
        margin-top: 20px;
        font-size: 32px;
        color: #98b0a4;
        max-width: 820px;
      }
      .tag b {
        color: #ffb047;
        font-weight: 600;
      }
      svg {
        position: absolute;
        right: 80px;
        top: 90px;
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <p style="letter-spacing: 0.18em; text-transform: uppercase; color: #5fe0a3">calwatson.com</p>
      <div>
        <h1 class="name">Cal Watson</h1>
        <p class="tag">Founder and operator. Engineer who builds for <b>real people</b>.</p>
      </div>
      <p style="color: #6e8a7d">Columbia, SC · A map, not a résumé</p>
    </div>
    <svg width="420" height="280" viewBox="0 0 420 280" fill="none">
      <circle cx="210" cy="40" r="16" fill="#F4FFF8" />
      <circle cx="70" cy="170" r="12" fill="none" stroke="#5FE0A3" stroke-width="3" />
      <circle cx="170" cy="190" r="12" fill="none" stroke="#5FE0A3" stroke-width="3" />
      <circle cx="270" cy="190" r="12" fill="none" stroke="#5FE0A3" stroke-width="3" />
      <circle cx="360" cy="150" r="12" fill="none" stroke="#5FE0A3" stroke-width="3" />
      <path d="M210 56 L70 158 M210 56 L170 178 M210 56 L270 178 M210 56 L360 138" stroke="#1C3126" stroke-width="2" />
      <path d="M70 170 L170 190 L270 190 L360 150" stroke="#5FE0A3" stroke-width="3" opacity="0.75" />
      <polygon points="360,92 368,108 386,108 372,118 377,136 360,126 343,136 348,118 334,108 352,108" fill="#FFB047" />
    </svg>
  </body>
</html>
